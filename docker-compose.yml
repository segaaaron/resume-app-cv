services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      PDF_SERVICE_URL: http://pdf-generator:3001
      PDF_SERVICE_SECRET: ${PDF_SERVICE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      pdf-generator:
        condition: service_healthy
    restart: unless-stopped

  pdf-generator:
    build:
      context: ./services/pdf-generator
      dockerfile: Dockerfile
    environment:
      PDF_SERVICE_SECRET: ${PDF_SERVICE_SECRET}
      MAX_CONCURRENT_PAGES: "6"
      PORT: "3001"
      NODE_ENV: production
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvvpro
      POSTGRES_PASSWORD: cvvpro_secret
      POSTGRES_DB: cvvpro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvvpro"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
